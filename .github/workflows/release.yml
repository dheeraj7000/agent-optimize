name: Release

# Triggered by version tags (v0.4.0, v0.5.0, ...). Runs the same gates as CI,
# builds the production image once, publishes it to GHCR, then deploys the
# prebuilt image to Fly.io. No remote build on Fly — faster and reproducible.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: python -m ruff check src/
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Verify build output
        run: test -f dashboard/dist/index.html

build-and-publish-image:
    needs: [test, build-dashboard]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "image=${IMAGE_LOWER}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE_LOWER}:${VERSION},${IMAGE_LOWER}:latest" >> "$GITHUB_OUTPUT"
      - name: Build production image
        run: docker build -f Dockerfile.production -t ${{ steps.meta.outputs.image }} .
      - name: Push image (version + latest tags)
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            docker tag "${{ steps.meta.outputs.image }}" "$tag"
            docker push "$tag"
          done

deploy-fly:
    needs: build-and-publish-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy prebuilt image to Fly.io
        run: flyctl deploy --image "${{ needs.build-and-publish-image.outputs.image }}" --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployment health
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://agentoptimize.fly.dev/health || true)
          echo "Health check returned: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Post-deploy health check returned $STATUS — verify manually with 'flyctl status'"
          fi
