services:
  agent-optimize:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      # Set to 'production' and AGENTOPTIMIZE_API_KEY_REQUIRED=true for locked-down deployments
      - AGENTOPTIMIZE_ENV=development
      - AGENTOPTIMIZE_API_KEY_REQUIRED=false
      - AGENTOPTIMIZE_DB_PATH=/data/agentoptimize.db
    volumes:
      - agent-data:/data
      - ./config.example.yaml:/app/config.yaml:ro
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  agent-data:

