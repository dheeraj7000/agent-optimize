# Fly.io deployment — pilot tier (~$2/month)
# Deploy: fly launch --copy-config --no-deploy && fly deploy

app = "agentoptimize"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.production"

[env]
  AGENTOPTIMIZE_DB_PATH = "/data/agentoptimize.db"
  AGENTOPTIMIZE_LOG_FORMAT = "json"
  AGENTOPTIMIZE_LOG_LEVEL = "info"
  AGENTOPTIMIZE_API_KEY_REQUIRED = "false"
  AGENTOPTIMIZE_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "agentoptimize_data"
  destination = "/data"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "5s"
    type = "http"
